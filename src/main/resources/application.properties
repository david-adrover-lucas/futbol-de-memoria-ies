spring.application.name=futbol-memoria

# XAMPP levanta MariaDB localmente en el puerto 3306.
# Si configuraste una clave para root, define la variable DB_PASSWORD antes de iniciar Spring.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/futbol_memoria}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# La estructura se crea con los scripts SQL. MariaDB 10.4 informa algunos tipos
# UNSIGNED de forma distinta a Hibernate 7, así que no validar ni modificar el esquema al iniciar.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Clasificacion al cierre de cada temporada. Puestos 1-6 garantizan Libertadores;
# puestos 7-12 garantizan Sudamericana y los equipos de prestigio 4-5 pueden
# mejorar ese cupo con la probabilidad de Libertadores. Fuera del puesto 12,
# se intenta Libertadores y, si falla, Sudamericana con probabilidad condicional.
# Los porcentajes solo aplican a equipos con prestigio 4 o 5 y van de 0 a 100.
juego.clasificacion.prestigio-maximo-por-tabla=3
juego.clasificacion.puesto-maximo-libertadores=6
juego.clasificacion.puesto-maximo-sudamericana=12
juego.clasificacion.probabilidad-libertadores-4=45
juego.clasificacion.probabilidad-sudamericana-4=65
juego.clasificacion.probabilidad-libertadores-5=80
juego.clasificacion.probabilidad-sudamericana-5=80
