<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="api-base-url" content="/api">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol de Memoria - Resultado</title>
    <link rel="stylesheet" href="../estilos/principal.css">
</head>
<body id="resultado-cuerpo">
    <main class="resultado-pantalla">
        <div class="resultado-cartel-wrap">
            <img id="resultado-cartel" class="resultado-cartel" src="../assets/cartel-ganaste.png" alt="Resultado">
            <strong id="resultado-texto-cartel">GANASTE</strong>
        </div>

        <section class="resultado-estadisticas">
            <div><span id="resultado-insignia-local">0</span><strong>RESPUESTAS CORRECTAS</strong><span id="resultado-insignia-visitante">0</span></div>
            <div><span id="resultado-remates-local">0</span><strong>GOLES DEL PARTIDO</strong><span id="resultado-remates-visitante">0</span><small id="resultado-penales" class="resultado-penales oculto"></small></div>
            <div><span id="resultado-comodines-local">0</span><strong>COMODINES</strong><span id="resultado-comodines-visitante">0</span></div>
        </section>

        <div class="resultado-experiencia-tarjeta">
            <img id="resultado-imagen-experiencia" class="resultado-experiencia-imagen" src="../assets/exp-positiva.png" alt="Experiencia">
            <strong id="resultado-variacion-experiencia">+100 XP</strong>
        </div>
        <div id="resultado-estrellas" class="resultado-estrellas">â˜…â˜…â˜…â˜†â˜†</div>
        <div class="resultado-experiencia-barra"><span id="resultado-barra-experiencia"></span><strong id="resultado-texto-experiencia">0/2000</strong></div>

        <section class="resultado-enfrentamiento">
            <img id="resultado-imagen-local" src="../assets/Boca_escudo.png" alt="">
            <strong>VS</strong>
            <img id="resultado-imagen-visitante" src="../assets/Escudo_del_Club_Atlético_Independiente.svg.png" alt="">
            <em id="resultado-fecha">FECHA 1</em>
        </section>

        <button type="button" id="boton-volver-menu-resultado" class="menu-pie-boton resultado-volver">VOLVER AL MENU</button>
    </main>

    <script src="../scripts/nucleo/cliente-api.js"></script>
    <script src="../scripts/nucleo/sesion.js"></script>
    <script src="../scripts/nucleo/adaptadores.js"></script>
    <script src="../scripts/nucleo/servicios.js"></script>
    <script src="../scripts/resultado-partido.js"></script>
</body>
</html>
