<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol de Memoria - Resultado</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body id="resultado-body">
    <main class="result-screen">
        <div class="result-banner-wrap">
            <img id="result-banner" class="result-banner" src="../assets/cartel-ganaste.png" alt="Resultado">
            <strong id="result-banner-text">GANASTE</strong>
        </div>

        <section class="result-stats">
            <div><span id="result-local-badge">50%</span><strong>POSESION</strong><span id="result-away-badge">50%</span></div>
            <div><span id="result-shots-local">0</span><strong>GOLES DEL PARTIDO</strong><span id="result-shots-away">0</span></div>
            <div><span id="result-wild-local">0</span><strong>COMODINES</strong><span id="result-wild-away">0</span></div>
        </section>

        <div class="result-exp-card">
            <img id="result-exp-img" class="result-exp-img" src="../assets/exp-positiva.png" alt="Experiencia">
            <strong id="result-exp-delta">+100 XP</strong>
        </div>
        <div id="result-stars" class="result-stars">★★★☆☆</div>
        <div class="result-exp-bar"><span id="result-exp-bar"></span><strong id="result-exp-text">0/2000</strong></div>

        <section class="result-versus">
            <img id="result-local-img" src="../assets/Boca_escudo.png" alt="">
            <strong>VS</strong>
            <img id="result-away-img" src="../assets/Escudo_del_Club_Atlético_Independiente.svg.png" alt="">
            <em id="result-date">FECHA 1</em>
        </section>

        <button type="button" id="btn-back-menu-result" class="menu-footer-btn result-back">VOLVER AL MENU</button>
    </main>

    <script src="../scripts/storage.js"></script>
    <script src="../scripts/experiencia.js"></script>
    <script src="../scripts/engine-partido.js"></script>
    <script src="../scripts/resultado-partido.js"></script>
</body>
</html>
