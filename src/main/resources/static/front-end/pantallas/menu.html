<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="api-base-url" content="/api">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol de Memoria - Menu</title>
    <link rel="stylesheet" href="../estilos/principal.css">
</head>
<body id="menu-cuerpo">
    <main class="menu-pantalla" aria-label="Menu principal">
        <header class="menu-encabezado">
            <div class="menu-entrenador-tarjeta">
                <div class="menu-medio-box">
                    <img id="menu-avatar-entrenador" class="menu-avatar" src="../assets/avatar-1.png" alt="Avatar DT">
                </div>
                <div class="menu-entrenador-informacion">
                    <div class="menu-entrenador-nombre-col">
                        <strong id="menu-nombre-entrenador">DT</strong>
                    </div>

                    <div class="menu-entrenador-centro" aria-label="Experiencia del DT">
                        <div id="menu-estrellas-entrenador" class="menu-estrellas-fila" aria-hidden="true"></div>
                        <div class="menu-experiencia-wrap">
                            <span id="menu-barra-experiencia" class="menu-experiencia-barra"></span>
                            <span id="menu-etiqueta-experiencia" class="menu-experiencia-label">0/2000</span>
                        </div>
                    </div>

                    <div class="menu-entrenador-datos-col">
                        <span id="menu-provincia-entrenador" class="menu-entrenador-datos">--</span>
                        <span id="menu-edad-entrenador" class="menu-entrenador-datos">-- AÑOS</span>
                    </div>
                </div>
            </div>

            <img class="menu-aplicacion-logo" src="../assets/logo-futbolmemoria.png" alt="Futbol de Memoria">

            <div class="menu-club-tarjeta">
                <div class="menu-club-informacion">
                    <strong id="menu-nombre-club">CLUB</strong>
                    <span id="menu-apodo-club">APODO</span>
                </div>
                <div class="menu-medio-box">
                    <img id="menu-insignia-club" class="menu-club-insignia" src="../assets/Boca_escudo.png" alt="Escudo del club">
                </div>
            </div>
        </header>

        <p id="menu-informacion-calendario" class="menu-calendario-informacion" aria-live="polite">Cargando próxima fecha...</p>

        <nav class="menu-navegacion" aria-label="Acciones principales">
            <button type="button" id="boton-jugar-menu" class="menu-boton activo" data-action="jugar">CARGANDO FECHA...</button>
            <button type="button" class="menu-boton" data-action="torneos">TORNEOS</button>
            <button type="button" class="menu-boton" data-action="temporada">TEMPORADA</button>
            <button type="button" class="menu-boton" data-panel="estadisticas">ESTADISTICAS</button>
            <button type="button" class="menu-boton" data-panel="objetivo">OBJETIVO DEL CLUB</button>
            <button type="button" class="menu-boton" data-panel="ofertas">OFERTAS DE CLUBES</button>
            <button type="button" class="menu-boton" data-panel="ranking">RANKING DE DT</button>
            <button type="button" class="menu-boton" data-action="noticias">PERFIL DT</button>
            <button type="button" class="menu-boton" data-panel="mensajes">BANDEJA DE MENSAJES</button>
        </nav>

        <section id="menu-panel-secundario" class="menu-secundario-panel oculto" aria-live="polite">
            <div class="menu-panel-contenido">
                <button type="button" id="boton-cerrar-panel-menu" class="menu-panel-cerrar">CERRAR PANEL</button>
                <h1 id="menu-titulo-panel">ESTADISTICAS</h1>
                <div id="menu-cuerpo-panel" class="menu-panel-cuerpo"></div>
            </div>
        </section>

        <div class="menu-pie-acciones">
            <button type="button" id="boton-guardar-partida" class="menu-pie-boton">GUARDAR PARTIDA</button>
            <button type="button" id="boton-cerrar-sesion-menu" class="menu-pie-boton">CERRAR SESION</button>
        </div>
    </main>

    <script src="../scripts/nucleo/cliente-api.js"></script>
    <script src="../scripts/nucleo/sesion.js"></script>
    <script src="../scripts/nucleo/adaptadores.js"></script>
    <script src="../scripts/nucleo/servicios.js"></script>
    <script src="../scripts/menu.js"></script>
</body>
</html>
