<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="api-base-url" content="/api">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fútbol de Memoria - Penales</title>
    <link rel="stylesheet" href="../estilos/principal.css">
</head>
<body id="partido-cuerpo" class="tanda-penales-cuerpo">
    <main class="partido-pantalla" aria-label="Tanda de penales">
        <section class="partido-marcador" aria-live="polite">
            <b id="fase-tanda-penales" class="marcador-competicion">TANDA DE PENALES</b>
            <div class="marcador-linea-principal">
                <strong id="codigo-local-tanda-penales">LOC</strong>
                <span id="marcador-jugador-tanda-penales">0</span>
                <img src="../assets/copa-libertadores.png" alt="">
                <span id="marcador-rival-tanda-penales">0</span>
                <strong id="codigo-visitante-tanda-penales">RIV</strong>
            </div>
            <em id="ronda-tanda-penales">TURNO 1 DE 10</em>
        </section>

        <section class="pregunta-zona tanda-penales-pregunta-zona">
            <div id="rol-tanda-penales" class="rol-tanda-penales">PATEÁS</div>
            <div id="temporizador-tanda-penales" class="partido-temporizador">15 SEGUNDOS</div>
            <h1 id="pregunta-tanda-penales" class="partido-pregunta">CARGANDO PREGUNTA</h1>
            <div id="respuestas-tanda-penales" class="respuestas-grilla"></div>
        </section>
    </main>

    <script src="../scripts/nucleo/cliente-api.js"></script>
    <script src="../scripts/nucleo/sesion.js"></script>
    <script src="../scripts/nucleo/adaptadores.js"></script>
    <script src="../scripts/nucleo/servicios.js"></script>
    <script src="../scripts/penales.js"></script>
</body>
</html>
