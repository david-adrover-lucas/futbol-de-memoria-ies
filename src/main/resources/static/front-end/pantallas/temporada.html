<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="api-base-url" content="/api">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol de Memoria - Temporada</title>
    <link rel="stylesheet" href="../estilos/principal.css">
</head>
<body id="temporada-cuerpo">
    <main class="carrera-pantalla pantalla-temporada">
        <header class="menu-encabezado temporada-menu-encabezado">
            <div class="menu-entrenador-tarjeta">
                <div class="menu-medio-box">
                    <img id="temporada-avatar-entrenador" class="menu-avatar" src="../assets/avatar-1.png" alt="Avatar DT">
                </div>
                <div class="menu-entrenador-informacion">
                    <strong id="temporada-nombre-entrenador">DT</strong>
                    <span id="temporada-edad-entrenador" class="menu-entrenador-datos">EDAD: --</span>
                    <span id="temporada-provincia-entrenador" class="menu-entrenador-datos">PROVINCIA: --</span>
                    <div id="temporada-estrellas-entrenador" class="menu-estrellas">â˜…â˜…â˜…â˜†â˜†</div>
                    <div class="menu-experiencia-wrap" aria-label="Experiencia del DT">
                        <span class="menu-experiencia-barra temporada-experiencia-barra"></span>
                    </div>
                </div>
            </div>

            <img class="menu-aplicacion-logo" src="../assets/logo-futbolmemoria.png" alt="Futbol de Memoria">

            <div class="menu-club-tarjeta">
                <div class="menu-club-informacion">
                    <strong id="temporada-nombre-club">BOCA JUNIORS</strong>
                    <span id="temporada-apodo-club">APODO</span>
                </div>
                <div class="menu-medio-box">
                    <img id="temporada-insignia-club" class="menu-club-insignia" src="../assets/Boca_escudo.png" alt="Escudo del club">
                </div>
            </div>
        </header>

        <h1 class="placa-titulo-pantalla">TEMPORADA</h1>

        <p id="temporada-informacion-calendario" class="temporada-calendario-informacion" aria-live="polite">Cargando calendario...</p>

        <section class="contenedor-tabla-temporada" aria-label="Tabla de posiciones de temporada">
            <div class="leyenda-temporada">
                <span class="leyenda-libertadores">LIBERTADORES</span>
                <span class="leyenda-sudamericana">SUDAMERICANA</span>
                <span class="leyenda-descenso">DESCENSO</span>
            </div>

            <div class="desplazamiento-tabla-temporada">
                <table class="tabla-temporada">
                    <thead>
                        <tr><th>N°</th><th>EQUIPOS</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th></tr>
                    </thead>
                    <tbody id="cuerpo-tabla-temporada"></tbody>
                </table>
            </div>
        </section>

        <footer class="temporada-pie" aria-label="Acciones de temporada">
            <button type="button" id="boton-menu-temporada" class="menu-pie-boton temporada-volver">VOLVER AL MENU</button>
        </footer>
    </main>

    <script src="../scripts/nucleo/cliente-api.js"></script>
    <script src="../scripts/nucleo/sesion.js"></script>
    <script src="../scripts/nucleo/adaptadores.js"></script>
    <script src="../scripts/nucleo/servicios.js"></script>
    <script src="../scripts/temporada.js"></script>
</body>
</html>
