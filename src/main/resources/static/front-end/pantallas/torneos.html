<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="api-base-url" content="/api">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol de Memoria - Torneos</title>
    <link rel="stylesheet" href="../estilos/principal.css">
</head>
<body id="torneos-cuerpo">
    <main class="carrera-pantalla torneo-pantalla">
        <header class="carrera-encabezado torneo-encabezado" aria-label="Datos del torneo">
            <div class="carrera-entrenador torneo-encabezado-lateral torneo-encabezado-perfil">
                <img id="avatar-entrenador-torneo" src="../assets/avatar-1.png" alt="">
                <div class="torneo-encabezado-texto">
                    <strong id="nombre-entrenador-torneo">DT</strong>
                    <span id="estrellas-entrenador-torneo">â˜…â˜…â˜…â˜†â˜†</span>
                </div>
            </div>

            <div class="torneo-encabezado-centro">
                <img class="carrera-logo torneo-logo" src="../assets/logo-futbolmemoria.png" alt="Futbol de Memoria">
            </div>

            <div class="carrera-club torneo-encabezado-lateral torneo-encabezado-club">
                <strong id="nombre-club-torneo">BOCA JUNIORS</strong>
                <img id="insignia-club-torneo" src="../assets/Boca_escudo.png" alt="Escudo del club">
            </div>
        </header>

        <h1 class="titulo-pagina-torneo">TORNEOS</h1>

        <nav id="selector-torneo" class="selector-torneo" aria-label="Seleccionar torneo">
            <button type="button" class="torneo-big-boton" data-torneo="libertadores">
                <span>LIBERTADORES</span>
            </button>
            <button type="button" class="torneo-big-boton" data-torneo="sudamericana">
                <span>SUDAMERICANA</span>
            </button>
            <button type="button" class="torneo-big-boton" data-torneo="nacional">
                <span>NACIONAL</span>
            </button>
        </nav>

        <section id="llave-torneo" class="llave-torneo oculto" aria-label="Llave del torneo">
            <div class="lienzo-llave-torneo">
                <header class="encabezado-llave-torneo">
                    <img id="logo-llave-torneo" class="torneo-llave-logo" src="../assets/logo-sudamericana.png" alt="">
                    <div class="contenedor-titulo-llave">
                        <h2 id="titulo-llave-torneo" class="torneo-llave-titulo">TORNEO</h2>
                        <span id="ronda-llave-torneo" class="ronda-llave-torneo">OCTAVOS A FINAL</span>
                        <p id="campeon-llave-torneo" class="campeon-llave-torneo" aria-live="polite"></p>
                    </div>
                    <img id="copa-llave-torneo" class="torneo-llave-copa" src="../assets/copa-sudamericana.png" alt="">
                </header>

                <div id="equipos-llave-torneo" class="equipos-llave-torneo"></div>
            </div>
        </section>

        <footer class="torneo-pie" aria-label="Acciones de torneo">
            <button type="button" id="boton-menu-torneo" class="menu-pie-boton">VOLVER AL MENU</button>
            <button type="button" id="boton-calendario-torneo" class="menu-pie-boton">IR AL CALENDARIO</button>
        </footer>
    </main>

    <script src="../scripts/nucleo/cliente-api.js"></script>
    <script src="../scripts/nucleo/sesion.js"></script>
    <script src="../scripts/nucleo/adaptadores.js"></script>
    <script src="../scripts/nucleo/servicios.js"></script>
    <script src="../scripts/torneos.js"></script>
</body>
</html>
